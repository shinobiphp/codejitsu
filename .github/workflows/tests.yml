name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: Verify vendored dependencies
        run: php -r "is_file('lib/autoload.php') || exit('Vendored dependencies are missing.');"

      - name: Run tests
        run: composer test
